services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  web:
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/one_workspace
      NEXTAUTH_SECRET: ""
      CREDENTIALS_MASTER_KEY: ""
      SMTP_PASSWORD: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
      CREDENTIALS_MASTER_KEY_FILE: /run/secrets/credentials_master_key
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      APP_URL: https://${APP_HOST:?Set APP_HOST}
    secrets:
      - nextauth_secret
      - credentials_master_key
      - smtp_password
    labels:
      traefik.http.routers.one-workspace.rule: "Host(`${APP_HOST:?Set APP_HOST}`)"
      traefik.http.routers.one-workspace.entrypoints: websecure
      traefik.http.routers.one-workspace.tls.certresolver: letsencrypt
      traefik.http.routers.one-workspace.middlewares: secure-headers
      traefik.http.routers.one-workspace-http.rule: "Host(`${APP_HOST:?Set APP_HOST}`)"
      traefik.http.routers.one-workspace-http.entrypoints: web
      traefik.http.routers.one-workspace-http.middlewares: redirect-https
      traefik.http.middlewares.redirect-https.redirectscheme.scheme: https
      traefik.http.middlewares.redirect-https.redirectscheme.permanent: "true"
      traefik.http.middlewares.secure-headers.headers.stsSeconds: "63072000"
      traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.secure-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.secure-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.secure-headers.headers.contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:"

  traefik:
    environment:
      TRAEFIK_BIND_ADDRESS_REQUIRED: ${TRAEFIK_BIND_ADDRESS:?Set TRAEFIK_BIND_ADDRESS to the public bind address}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?Set TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
    ports:
      - "${TRAEFIK_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - traefik_certs:/letsencrypt

secrets:
  nextauth_secret:
    file: ${NEXTAUTH_SECRET_FILE:?Set NEXTAUTH_SECRET_FILE}
  credentials_master_key:
    file: ${CREDENTIALS_MASTER_KEY_FILE:?Set CREDENTIALS_MASTER_KEY_FILE}
  smtp_password:
    file: ${SMTP_PASSWORD_FILE:?Set SMTP_PASSWORD_FILE}

volumes:
  traefik_certs:
